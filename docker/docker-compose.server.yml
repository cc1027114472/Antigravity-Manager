services:
  antigravity-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
      args:
        USE_MIRROR: ${USE_MIRROR:-auto}
    image: antigravity-manager:server
    container_name: antigravity-manager
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8045:8045"
    volumes:
      - /opt/antigravity-manager/data:/root/.antigravity_tools
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ABV_MAX_BODY_SIZE: ${ABV_MAX_BODY_SIZE:-104857600}
      ABV_PUBLIC_URL: ${ABV_PUBLIC_URL:-}
      ABV_BIND_LOCAL_ONLY: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8045 && printf \"GET /health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
